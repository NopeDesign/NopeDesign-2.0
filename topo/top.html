<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - NOR Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="/topo/src/logo_topo.png" alt="NOR Design">
            </a>

            <!-- 👇 ÍCONE DO HAMBÚRGUER AQUI 👇 -->
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Navegação -->
            <nav class="main-nav" id="main-nav">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Quem Somos</a></li>
                    <li><a href="#">Projetos</a></li>
                    <li><a href="#">Serviços</a></li>
                </ul>
            </nav>

            <!-- Botão -->
            <a href="#" class="btn-orcamento" id="btn-orcamento">Solicite orçamento</a>
            
        </div>
    </header>

    <!-- 👇 SCRIPT MÁGICO DO MENU (Colar no final do body) 👇 -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const mainNav = document.getElementById('main-nav');
        const btnOrcamento = document.getElementById('btn-orcamento');

        hamburger.addEventListener('click', () => {
            // Essa função coloca e tira a classe "active" que criamos no CSS
            hamburger.classList.toggle('active');
            mainNav.classList.toggle('active');
            btnOrcamento.classList.toggle('active');
        });
    </script>
</body>
</html>
